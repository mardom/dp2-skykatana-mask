# Full DP2 footprint + Monster bright-star mask tuned for 32 GB RAM RSP Nublado pods.
# Peak working set is ~5-7 GiB across 6,000+ deg^2 (leaving >24 GiB headroom on RSP).
# Run on RSP:
#   ./scripts/run_rsp_mask.sh configs/dp2_wfd_default.yaml

butler:
  repo: "dp2"
  collections: ["dp2"]

region:
  mode: "full"

property_maps:
  enabled: true
  skymap: "lsst_cells_v2"
  # order_sparse=14 (NSIDE=16384, ~12.9") captures visit/tract depth structure cleanly
  # while keeping propmask bit-packed memory tiny; combined with order=15 star halos below!
  order_sparse: 14
  order_cov: 5
  bands: ["u", "g", "r", "i", "z", "y"]
  min_filters: 4             # Pixel must satisfy cuts in at least 4 of the 6 bands
  required_bands: ["r", "i"] # r and i bands must pass at every valid pixel
  keep_per_band_stages: false
  per_band:
    u:
      min_exposures: 2
      nominal_exptime_sec: 30.0
      exposure_subpixel_tol: 0.05
      min_maglim: 23.6
    g:
      min_exposures: 3
      nominal_exptime_sec: 30.0
      exposure_subpixel_tol: 0.05
      min_maglim: 24.6
    r:
      min_exposures: 4
      nominal_exptime_sec: 30.0
      exposure_subpixel_tol: 0.05
      min_maglim: 24.4
      max_psf_fwhm_arcsec: 1.50
    i:
      min_exposures: 4
      nominal_exptime_sec: 30.0
      exposure_subpixel_tol: 0.05
      min_maglim: 24.0
      max_psf_fwhm_arcsec: 1.50
    z:
      min_exposures: 3
      nominal_exptime_sec: 30.0
      exposure_subpixel_tol: 0.05
      min_maglim: 23.3
    y:
      min_exposures: 2
      nominal_exptime_sec: 30.0
      exposure_subpixel_tol: 0.05
      min_maglim: 22.1

# DP2 Tutorial 311.1 Milky Way dust de-reddening + nominal WFD extragalactic ceiling E(B-V) <= 0.12
dust:
  enabled: true
  apply_to_maglim: true
  r_v: 3.1
  ebv_source: "auto"
  max_ebv: 0.12
  min_galactic_lat_deg: 5.0
  order_sparse: 11

monster_stars:
  enabled: true
  dataset_type: "auto"
  order_sparse: 15           # Native NSIDE=32768 (~6.44") for sharp stellar exclusion halos
  reference_bands: ["g", "r", "i", "z"]
  mag_min: -5.0
  mag_max: 18.0
  radius_model: "skykatana_rubin"
  profile_band: "r"
  completeness: 0.85
  use_faint_floor: false
  min_radius_arcsec: 5.0
  max_radius_arcsec: 600.0
  enable_bleed_boxes: false
  save_star_circles_parquet: true

galactic_mask:
  enabled: true
  order_sparse: 10
  b0_deg: 15.0
  bulge_a_deg: 25.0
  bulge_b_deg: 20.0

memory:
  max_ram_gib: 32.0
  soft_warning_fraction: 0.75
  hard_abort_fraction: 0.90
  cov_batch_size: 64
  htm7_query_batch_size: 200
  htm7_stream_flush_rows: 250000
  circle_chunk_size: 100000
  skykatana_threads: 2

output:
  output_dir: "outputs/dp2_wfd_default"
  overwrite: true
  order_out: 15
  order_cov: 5
  write_skykatana_pipe: true
  write_healsparse_fits: true
  write_moc_fits: true
  moc_max_order: 13
  write_fracdet_map: true
  fracdet_order: 10
  n_random_points: 500000
  make_qa_plots: true
